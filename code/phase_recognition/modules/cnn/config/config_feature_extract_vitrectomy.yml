module: cnn.feature_extraction.FeatureExtraction
model: cnn.ResNet50Model
dataset: vitrectomy_feature_extract.VitrectomyFeatureExtract

# Dataframes are loaded from {data_root}/dataframes/vitrectomy_1fps_<camera>.pkl
# (the "dataframes" subdir name is hardcoded in
#  datasets/vitrectomy_feature_extract.py).
data_root: data/vitrectomy
output_path: outputs

out_features: 5
batch_size: 128
model_specific_batch_size_max: 128
num_workers: 8
input_height: 256
input_width: 256

pickle_export_folder: vitrectomy_pickle_export
# `gpu` instead of `auto`: fail loud if CUDA isn't available, never silently
# fall back to CPU (which would be ~100x slower for ResNet50).
accelerator: gpu

# Which camera dataframe to load: vitrectomy_1fps_<camera>.pkl
# Overridden per camera by run_loo_cv.sh / run_expAB.sh.
camera: camera01

# Held-out video for LOO cross-validation (run_loo_cv.sh overrides via --test_fold)
test_fold: 8
# Base RNG seed; effective per-fold seed = seed + test_fold
seed: 1234
pretrained: True
test_extract: True

early_stopping_metric: val_acc_phase
max_epochs: 15
min_epochs: 5
save_top_k: 1
fast_dev_run: False
num_sanity_val_steps: 0
log_every_n_steps: 10

learning_rate: 0.0001
